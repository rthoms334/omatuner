[package]
name = "tuner"
version = "0.2.3"
edition = "2024"
rust-version = "1.95"
description = "Tuner: a keyboard-first IPTV player for Omarchy (Hyprland)"
license = "GPL-3.0-or-later" # Arch's libmpv is built with GPL components; see docs/DESIGN.md §22
repository = "https://github.com/rthoms334/omatuner"
readme = "README.md"
default-run = "tuner"

[lib]
name = "tuner"
path = "src/lib.rs"

[[bin]]
name = "tuner"
path = "src/main.rs"

# Bench targets (DESIGN §24.2 "numeric gates"); each file is owned by the WP named in it.
# Datasets: scripts/gen-big-fixtures.py (WP-00) → target/big-fixtures/.
[[bench]]
name = "m3u"        # WP-03: 100k-entry M3U parse
harness = false

[[bench]]
name = "xmltv"      # WP-05a: 415k-programme XMLTV parse
harness = false

[[bench]]
name = "store"      # WP-02: upserts, EPG window/now-next queries, library load
harness = false

[[bench]]
name = "search"     # WP-09: global search tick, ListFilter
harness = false

[[bench]]
name = "import"     # WP-06: end-to-end imports
harness = false

[[bench]]
name = "guide"      # WP-11: epg_grid layout+paint, headless egui, fake EpgReader
harness = false

[[bench]]
name = "startup"    # WP-13: first frame + library load on a 100k-channel profile
harness = false

[[bench]]
name = "follow"     # F-AB (batch): Following evaluation over 760k programmes
harness = false

# ---------------------------------------------------------------------------
# Every v1 dependency is declared here. Work packages MUST NOT edit this file;
# if you need a crate, ask the architect (see docs/DESIGN.md §24 "Frozen files").
# Versions verified with `cargo info` on 2026-10-09.
# ---------------------------------------------------------------------------
[dependencies]
# UI / GL — use eframe::egui and eframe::glow ONLY (glow 0.17 via eframe; never add glow directly)
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "wayland", "default_fonts", "accesskit"] }
raw-window-handle = "0.6.2"

# mpv: libmpv2 for control (Mpv handle, commands, properties); libmpv2-sys for the render API + raw events
libmpv2 = "=6.0.0"
libmpv2-sys = "=4.0.1"

# async runtime / concurrency
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7.20", features = ["rt"] }   # CancellationToken
futures-util = "0.3.34"
bytes = "1.12.1"
crossbeam-channel = "0.5.17"

# networking
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "zstd", "json", "query", "stream", "charset", "system-proxy"] }
url = "2.5.8"

# parsing / formats
quick-xml = "0.42.0"
flate2 = "1.1.10"
liblzma = "0.4.8"
memchr = "2.8.3"
encoding_rs = "0.8.42"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"
base64 = "0.23.1"
regex = "1.13.1"

# storage
rusqlite = { version = "0.40.2", features = ["bundled"] }   # SQLite 3.53 with FTS5
directories = "6.0.0"

# text, names, matching, search
deunicode = "1.6.2"
aho-corasick = "=1.1.5"      # textmatch::terms (B3): one automaton over Following / spoiler-guard terms
strsim = "0.11.1"
nucleo = "0.5.0"            # MPL-2.0; threaded incremental matcher for global search
nucleo-matcher = "0.3.1"    # MPL-2.0; single-list type-to-filter
unicode-bidi = "0.3.18"     # visual reordering for RTL labels (egui has no bidi)
ar-reshaper = "1.5.0"       # Arabic presentation forms (egui has no shaping)
unicode-general-category = "1.1.0"  # S*/P* separators of provider names (name_tokens; already in the tree via epaint)

# time
jiff = "0.2.38"             # tz-aware (server-local catch-up times)

# images
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = "0.48.1"
fast_image_resize = "6.1.0"
blake3 = "1.8.7"
lru = "0.18.5"

# desktop integration
notify = { version = "8.2.0", default-features = false }          # theme/font live reload (inotify)
mpris-server = { version = "0.10.0", features = ["tokio"] }        # MPL-2.0
notify-rust = { version = "4.18.2", default-features = false, features = ["z-with-tokio"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }  # zwp_idle_inhibit_manager_v1

# cli, errors, logging
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
axum = "0.8.9"              # mock Xtream panel in tests/support
insta = "1.49.0"
criterion = "0.8.2"
egui_kittest = "=0.36.2"   # headless widget/screen tests (no GPU; accesskit queries)
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "test-util"] }

[profile.dev]
opt-level = 1               # parsers + software video paths are painfully slow at 0

[profile.dev.package."*"]
opt-level = 3               # deps (sqlite, image, quick-xml, egui) optimised even in dev

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = "line-tables-only"  # usable backtraces from coredumps
strip = "debuginfo"
